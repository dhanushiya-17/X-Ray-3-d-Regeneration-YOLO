<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoneVision · Single-view femur estimate</title>
  <meta name="description" content="Research prototype: estimate a 3D femur surface from one AP radiograph with a CT-trained shape prior.">
  <meta name="theme-color" content="#0d141b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d141b'/%3E%3Cpath d='M12 7a3 3 0 1 0-1 5.5L19 22a3 3 0 1 0 2-1 3 3 0 1 0-1-5.5L13 8.5a3 3 0 0 0-1-1.5Z' fill='%23d8ecfa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <canvas id="stage" aria-label="Interactive 3D femur viewer. Drag to orbit, scroll to zoom." role="img"></canvas>
  <div class="stage-glow" aria-hidden="true"></div>

  <header class="top">
    <a class="wordmark" href="#/case" aria-label="BoneVision home">BONEVISION</a>
    <nav class="notch" aria-label="Case pages">
      <ul id="nav"></ul>
    </nav>
    <div class="top-right">
      <span id="engine" class="engine" role="status"></span>
      <button id="new-case" class="pill pill-ice" type="button"></button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <aside class="rail" aria-hidden="true">
    <span class="rail-num" id="rail-num">01</span>
    <span class="rail-of">/ 05</span>
    <span class="rail-ticks" id="rail-ticks"></span>
    <span class="rail-label" id="rail-label">The input</span>
  </aside>

  <main id="view" tabindex="-1"></main>

  <footer class="dock">
    <div class="section-tag" aria-hidden="true"><span id="tag-num">01</span><i></i><span id="tag-label">THE INPUT</span></div>
    <div class="dock-right">
      <div class="pill-group" role="group" aria-label="Viewer controls">
        <button id="toggle-rotate" class="pill pill-ghost" type="button" aria-pressed="true"></button>
        <button id="toggle-wire" class="pill pill-ghost" type="button" aria-pressed="false"></button>
      </div>
      <button id="dock-cta" class="pill pill-ice pill-lg" type="button"></button>
    </div>
  </footer>

  <div id="drop-veil" class="drop-veil" hidden><div><span class="eyebrow">Drop to load</span><p>One femur radiograph · PNG, JPEG, TIFF or DICOM</p></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input id="file-input" type="file" accept=".png,.jpg,.jpeg,.tif,.tiff,.dcm,.dicom,image/png,image/jpeg,image/tiff,application/dicom" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
